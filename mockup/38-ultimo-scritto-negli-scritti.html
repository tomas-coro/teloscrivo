<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup 38 - Ultimo scritto negli scritti</title>
<style>
  body{margin:0;background:#0b0f1a;color:#cfd8e3;font-family:Poppins,sans-serif}
  .mkbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:#0b0f1a;border-bottom:1px solid #ffffff22}
  .mkbar button{font:600 .72rem "Roboto Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid #ffffff44;background:transparent;color:#cfd8e3;cursor:pointer}
  .mkbar button[aria-pressed=true]{background:#FD6E88;border-color:#FD6E88;color:#072D59}
  .mkbar .sep{width:1px;background:#ffffff33;margin:4px 6px}
  .why{max-width:60rem;margin:14px auto 0;padding:0 16px;font:400 .8rem/1.5 Poppins,sans-serif;color:#9fb0c4;text-align:center}
  .stage{display:flex;justify-content:center;margin:14px 0 40px}
  iframe{border:1px solid #ffffff22;border-radius:12px;background:#072D59;max-width:100%}
</style>
</head>
<body>
<div class="mkbar" role="toolbar" aria-label="Direzioni">
  <button data-d="A" aria-pressed="true">A · Riga larga</button>
  <button data-d="B" aria-pressed="false">B · Accanto al titolo</button>
  <button data-d="C" aria-pressed="false">C · Striscia orizzontale</button>
  <span class="sep"></span>
  <button data-v="m" aria-pressed="false">Mobile</button>
  <button data-v="d" aria-pressed="true">Desktop</button>
</div>
<p class="why" id="why"></p>
<div class="stage"><iframe id="f" title="Anteprima"></iframe></div>

<script>
const MAIN = "<main id=\"contenuto\" class=\"page\"><div class=\"wrapin\">\n  <section class=\"hero\">\n    <div class=\"hero-l\">\n      <h1 class=\"hero-h\">teloscrivo<span class=\"dot\" aria-hidden=\"true\"><\/span><\/h1>\n      <p class=\"hero-sub\">la luna porta consiglio<\/p>\n    <\/div>\n    <article class=\"last\">\n      <div class=\"wbar\"><span class=\"wd\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/span><p class=\"cap lk\"><span data-lk>Ultimo scritto · <b class=\"lk-cat\">Pensiero · Poesia<\/b> · 4 nov<\/span><\/p><span aria-hidden=\"true\"><\/span><\/div>\n      <div class=\"wbody\"><p class=\"lt\" data-lt>Nella nostra testa<\/p><p class=\"lx\" data-lx>Il limite più grande che esista è nella nostra testa, ce lo auto-imponiamo e non è nulla di più vicino a quello che siamo realmente.<\/p><\/div>\n      <div class=\"lf\"><div class=\"last-controls\"><div class=\"pg\" data-pg role=\"group\" aria-label=\"Ultimi scritti\"><\/div><button class=\"pause\" data-pause type=\"button\" aria-label=\"Metti in pausa gli ultimi scritti\" hidden>❚❚<\/button><\/div><a class=\"cta\" data-cta href=\"scritti/nella-nostra-testa/\">Leggi<svg viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M4 10h11M11 5l5 5-5 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/a><\/div>\n    <\/article>\n  <\/section>\n  <section class=\"bk\" aria-labelledby=\"h-book\" data-book><div class=\"bk-box\"><div class=\"bk-l\"><p class=\"cap bk-kick\">Il libro · <b>in corso<\/b><\/p><h2 id=\"h-book\" class=\"bk-ttl\">La sindrome del cielo<\/h2><p class=\"bk-quarta\">Illyrium, la Culla del Cielo, non perdona chi è diverso. Aetherion è un’anomalia: una cicatrice sul petto e un potere instabile che non risponde a nessuna regola conosciuta. Un potere che non crea, ma distrugge.<\/p><\/div><div class=\"bk-r\"><a class=\"bk-go\" href=\"scritti/prologo/\" data-bk-go><span class=\"bk-mark\" aria-hidden=\"true\"><\/span><span class=\"bk-lbl\"><span class=\"bk-k\" data-bk-k>Inizia da<\/span> <span class=\"bk-t\" data-bk-t>Prologo&nbsp;·&nbsp;La Culla del Cielo<\/span><\/span><span class=\"bk-min\" data-bk-min>2 min<\/span><span class=\"bk-arr\" aria-hidden=\"true\">→<\/span><\/a><div class=\"bk-bar\" data-bk-bar hidden><i data-bk-fill><\/i><\/div><div class=\"bk-foot\"><p class=\"bk-ghost\" data-bk-ghost>circa 11 min di lettura<\/p><a class=\"bk-all\" href=\"libro/\" data-bk-all hidden>Tutti i capitoli <span aria-hidden=\"true\">→<\/span><\/a><\/div><ol class=\"bk-toc\" aria-label=\"Ultimi capitoli\"><li><a href=\"scritti/prologo/\"><span class=\"bk-n\">P<\/span><span class=\"bk-ct\">La Culla del Cielo<\/span><span class=\"bk-cm\">2 min<\/span><\/a><\/li><li><a href=\"scritti/reietto/\"><span class=\"bk-n\">1<\/span><span class=\"bk-ct\">Reietto<\/span><span class=\"bk-cm\">9 min<\/span><\/a><\/li><\/ol><\/div><\/div><\/section>\n  <section class=\"desk-section\" aria-labelledby=\"h-all\"><div class=\"sec-h\"><h2 id=\"h-all\">Gli scritti<\/h2><span class=\"cap count\">3 scritti<\/span><\/div><p>Una finestra per ogni scritto: aprila per leggere.<\/p>\n    <div class=\"desk-shelf\"><article class=\"desk-window\" data-cat=\"pensieri\"><div class=\"desk-bar\"><i><\/i><i><\/i><i><\/i><span>nella-nostra-testa.txt<\/span><\/div><a href=\"scritti/nella-nostra-testa/\" data-card><span class=\"desk-photo has-img\" aria-hidden=\"true\"><img src=\"assets/foto/nella-nostra-testa-720.webp\" srcset=\"assets/foto/nella-nostra-testa-720.webp 720w\" sizes=\"(min-width:900px) 380px, 90vw\" alt=\"\" width=\"720\" height=\"450\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 50%\"><\/span><span class=\"desk-info\"><span class=\"desk-meta\"><b>Pensiero · Poesia<\/b>4 novembre<\/span><span class=\"desk-title\">Nella nostra testa<\/span><span class=\"desk-excerpt\">Il limite più grande che esista è nella nostra testa, ce lo auto-imponiamo e non è nulla di più vicino a quello che siamo realmente.<\/span><span class=\"desk-more\"><span class=\"t\">Apri lo scritto<\/span><i class=\"arr\" aria-hidden=\"true\">↗<\/i><\/span><\/span><\/a><\/article><article class=\"desk-window\" data-cat=\"pensieri\"><div class=\"desk-bar\"><i><\/i><i><\/i><i><\/i><span>limite-specchio.txt<\/span><\/div><a href=\"scritti/limite-specchio/\" data-card><span class=\"desk-photo has-img\" aria-hidden=\"true\"><img src=\"assets/foto/limite-specchio-736.webp\" srcset=\"assets/foto/limite-specchio-736.webp 736w\" sizes=\"(min-width:900px) 380px, 90vw\" alt=\"\" width=\"736\" height=\"460\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 50%\"><\/span><span class=\"desk-info\"><span class=\"desk-meta\"><b>Pensiero · daCitazione<\/b>4 novembre<\/span><span class=\"desk-title\">Limite/Specchio<\/span><span class=\"desk-excerpt\">Guardarsi allo specchio può portarci a dubitare di quello che vediamo.<\/span><span class=\"desk-more\"><span class=\"t\">Apri lo scritto<\/span><i class=\"arr\" aria-hidden=\"true\">↗<\/i><\/span><\/span><\/a><\/article><article class=\"desk-window\" data-cat=\"poesie\"><div class=\"desk-bar\"><i><\/i><i><\/i><i><\/i><span>la-vita-con-te.txt<\/span><\/div><a href=\"scritti/la-vita-con-te/\" data-card><span class=\"desk-photo has-img\" aria-hidden=\"true\"><img src=\"assets/foto/la-vita-con-te-662.webp\" srcset=\"assets/foto/la-vita-con-te-662.webp 662w\" sizes=\"(min-width:900px) 380px, 90vw\" alt=\"\" width=\"662\" height=\"414\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 50%\"><\/span><span class=\"desk-info\"><span class=\"desk-meta\"><b>Poesia<\/b>4 novembre<\/span><span class=\"desk-title\">La vita con te<\/span><span class=\"desk-excerpt\">Quanta vita che voglio Vivere con te, condividere Lacrime e sorrisi, litigate<\/span><span class=\"desk-more\"><span class=\"t\">Apri lo scritto<\/span><i class=\"arr\" aria-hidden=\"true\">↗<\/i><\/span><\/span><\/a><\/article><\/div>\n  <\/section>\n  \n  <footer class=\"foot\"><span class=\"wm2\">teloscrivo<span class=\"dot\" aria-hidden=\"true\"><\/span><\/span><span>© 2026 teloscrivo<\/span><a class=\"up\" href=\"#inizio\">Torna su<svg viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M10 16V4M5 9l5-5 5 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/a><\/footer>\n<\/div><\/main>";
// Card "Ultimo scritto": torna ROOMY (valori di prima), poi ogni direzione la mette in un posto/forma diversi.
const base = `
  .hero{display:block}
  .hero-l{padding:6px 0 8px}
  .wbar{height:40px}
  .wbody{padding:24px 26px 8px}
  .lt{font-size:2.5rem;margin:0 0 14px}
  .lx{font-size:1.1rem;line-height:1.75;min-height:0;margin:0 0 20px;display:block;overflow:visible}
  .lf{padding:12px 14px 12px 20px}
  .lk-cat{text-transform:none;letter-spacing:.04em;font:500 .8rem Poppins,sans-serif;color:var(--fg)}
  .last{margin:6px 0 30px}`;
const css = {
  // A: la card e' la prima riga della sezione "Gli scritti", a tutta larghezza
  A: base + `.last{margin:22px 0 34px}`,
  // B: titolo + frase della sezione a sinistra, card a destra (su telefono: una sotto l'altra)
  B: base + `
    @media (min-width:760px){.mk-top{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:end;margin-bottom:34px}.mk-top .last{margin:0}.mk-top .sec-h,.mk-top>div>p{margin-bottom:0}}
    @media (max-width:759px){.mk-top .last{margin:20px 0 30px}}`,
  // C: striscia orizzontale: titolo+categoria a sinistra, frase e "Leggi" a destra (su telefono diventa una colonna)
  C: base + `
    .last{margin:20px 0 34px}
    @media (min-width:760px){
      .last{display:grid;grid-template-columns:1fr auto;grid-template-areas:"bar bar" "body cta";align-items:center}
      .last .wbar{grid-area:bar}.last .wbody{grid-area:body;padding:20px 26px}.last .lt{font-size:2.2rem;margin:0 0 8px}.last .lx{margin:0;font-size:1.02rem}
      .last .lf{grid-area:cta;border-top:0;border-left:1px solid var(--line);align-self:stretch;padding:0 22px;display:flex;align-items:center;background:var(--soft)}
    }`
};
const why = {
  A:'La card sta sopra il primo scritto, nella sezione "Gli scritti", larga e con aria come prima. La hero resta solo wordmark e sottotitolo.',
  B:'Su desktop titolo e frase della sezione a sinistra, card a destra, sulla stessa altezza. Sul telefono una sotto l\'altra.',
  C:'Striscia: il titolo e la frase a sinistra, "Leggi" a destra su una colonna sua. Più bassa delle altre, ma con respiro.'
};
const f = document.getElementById('f'), whyEl = document.getElementById('why');
let d = 'A', v = 'd';
try { d = localStorage.getItem('m38d') || d; v = localStorage.getItem('m38v') || v } catch (e) {}
if (/^#[ABC]/.test(location.hash)) d = location.hash[1];
if (/^#[ABC]m/.test(location.hash)) v = 'm';
function draw() {
  f.style.width = v === 'm' ? '390px' : '1240px';
  const place = `<script>
    const last = document.querySelector('.hero .last'), sec = document.querySelector('.desk-section'), d = '${d}';
    const head = sec.querySelector('.sec-h'), intro = sec.querySelector('.sec-h + p');
    last.querySelector('.pause')?.remove();
    if (d === 'B') { const top = document.createElement('div'); top.className = 'mk-top'; const left = document.createElement('div'); sec.insertBefore(top, head); left.append(head, intro); top.append(left, last); }
    else { sec.insertBefore(last, intro.nextSibling); }
  <\/script>`;
  f.srcdoc = `<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <base href="${location.href.replace(/mockup\/[^/]*$/, '')}">
    <link rel="stylesheet" href="style.css"><style>${css[d]}</style></head>
    <body id="inizio"><div class="sky" aria-hidden="true"></div>
    <header class="tbar"><a class="brand" href="#"><img src="assets/logo/monogramma-navy.svg" alt="" width="34" height="34"></a></header>
    ${MAIN}${place}</body></html>`;
  f.onload = () => { try { f.style.height = f.contentDocument.documentElement.scrollHeight + 'px' } catch (e) {} };
  whyEl.textContent = why[d];
  document.querySelectorAll('[data-d]').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === d));
  document.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  try { localStorage.setItem('m38d', d); localStorage.setItem('m38v', v) } catch (e) {}
}
document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { d = b.dataset.d; draw() });
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { v = b.dataset.v; draw() });
draw();
</script>
</body>
</html>
