<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Icone categorie</title>
<style>:root{--navy:#0b2a55;--pink:#ff6b8b;--fg:#eaf4ff;--line:#ffffff2a;color-scheme:dark}body{margin:0;padding:24px 18px;background:#22345f;color:var(--fg);font:400 15px Poppins,system-ui,sans-serif}
h2{font:600 .7rem "Roboto Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin:28px 0 12px}.r{display:flex;flex-wrap:wrap;gap:10px}
.catchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border:1px solid color-mix(in srgb,var(--pink) 55%,var(--line));border-radius:99px;background:color-mix(in srgb,var(--pink) 12%,transparent);color:var(--fg);font-size:.82rem;text-decoration:none;transition:background .2s,color .2s,transform .15s}
.catchip:hover{background:var(--pink);color:var(--navy)}
.catchip:active{transform:scale(.97)}
.catchip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.catchip .ac{stroke:var(--pink);transition:stroke .2s}
.catchip:hover .ac{stroke:var(--navy)}
.catchip svg{width:var(--s,18px);height:var(--s,18px)}</style>
