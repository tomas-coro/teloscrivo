<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teloscrivo - mockup 08</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
/* ===== FONT DI TOMAS (cartella fonts/) ===== */
@font-face{font-family:"Fibonacci";src:url("fonts/fibonacci.ttf");font-style:normal}
@font-face{font-family:"Fibonacci";src:url("fonts/fibonacci-italic.ttf");font-style:italic}
@font-face{font-family:"Vetro";src:url("fonts/vetro.otf")}
@font-face{font-family:"Balligesta";src:url("fonts/balligesta.otf")}

:root{
  --seal:#DBF2FC; --navy:#072D59; --deep:#041B38; --pink:#FD6E88;
  --serif:"Newsreader","Iowan Old Style",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0a1424;color:var(--seal);font-family:var(--serif);-webkit-font-smoothing:antialiased}

/* ===== SHELL DEL MOCKUP (controlli) ===== */
.shell{max-width:1360px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:12px}
.top h1{font:italic 400 1.7rem/1 "Fibonacci";margin:0 12px 0 0}
.top h1 i{display:inline-block;width:.17em;height:.17em;border-radius:50%;background:var(--pink);margin-left:.06em}
.grp{display:flex;gap:6px;flex-wrap:wrap}
.grp button{font:500 .78rem var(--serif);letter-spacing:.14em;text-transform:uppercase;color:#9db6cc;background:transparent;border:1px solid #20344f;border-radius:8px;padding:0 14px;min-height:44px;cursor:pointer}
.grp button[aria-pressed="true"]{color:var(--deep);background:var(--seal);border-color:var(--seal)}
.grp button:hover{color:var(--seal);border-color:#3c5a80}
.grp button[aria-pressed="true"]:hover{color:var(--deep)}
.why{font-size:.95rem;color:#9db6cc;max-width:90ch;margin:0 0 16px;line-height:1.5;text-wrap:pretty}
.why b{color:var(--seal);font-weight:500}
.stagebox{display:flex;justify-content:center}

/* ===== DEVICE: il "palco" in cui gira il sito ===== */
.device{position:relative;overflow:hidden;background:var(--deep);container-type:size;
  width:390px;max-width:100%;height:min(800px,calc(100vh - 190px));min-height:560px;border-radius:30px;border:1px solid #2a4163}
.device.d{width:100%;max-width:1280px;border-radius:14px;height:min(780px,calc(100vh - 190px))}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:auto}
.scroller::-webkit-scrollbar{display:none}

/* ===== ELEMENTI COMUNI DEL SITO ===== */
.logo{font-family:"Fibonacci",serif;font-style:italic;font-weight:400;letter-spacing:-.01em;line-height:1;color:#fff;white-space:nowrap}
.logo i{display:inline-block;width:.15em;height:.15em;border-radius:50%;background:var(--pink);margin-left:.05em}
.tag{font:italic 400 .78rem/1.3 "Fibonacci";letter-spacing:.3em;text-transform:uppercase;color:var(--seal);display:flex;align-items:center;gap:12px;margin:14px 0 0}
.tag::before{content:"";width:26px;height:2px;background:var(--pink);flex:none}
.vet{font-family:"Vetro",serif;font-variant-ligatures:none;text-transform:uppercase;font-weight:400;letter-spacing:.02em;line-height:1}
.num{font-family:"Fibonacci",serif;font-weight:400}
.lab{font:500 .74rem/1 var(--serif);letter-spacing:.24em;text-transform:uppercase;color:var(--pink);margin:0 0 18px}
a{color:inherit;text-decoration:none}
.go{cursor:pointer}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--pink);color:var(--pink);font:500 .8rem var(--serif);letter-spacing:.14em;text-transform:uppercase;border-radius:6px;background:transparent;cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--pink);color:var(--deep)}
.cue{font:italic 400 .72rem "Fibonacci";letter-spacing:.34em;text-transform:uppercase;color:var(--seal);opacity:.8}
.sig{font-family:"Balligesta",cursive;font-size:3rem;line-height:1;color:var(--pink);margin-top:34px}
.prog{position:sticky;top:0;height:3px;z-index:30;background:rgba(219,242,252,.12)}
.prog b{display:block;height:100%;width:0;background:var(--pink)}
.ex{font:italic .76rem var(--serif);opacity:.6}

/* card TikTok e Spotify (comuni) */
.tt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tt a{aspect-ratio:9/16;border-radius:6px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;font-size:.78rem;line-height:1.25;color:#fff;background-image:url("img/luna-mobile.webp");background-size:260%}
.tt a:nth-child(1){background-position:78% 18%}.tt a:nth-child(2){background-position:20% 60%}.tt a:nth-child(3){background-position:60% 96%}
.tt a::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(4,27,56,.9))}
.tt a span{position:relative;z-index:1}
.tt a:hover{outline:2px solid var(--pink);outline-offset:2px}
.song{border:1px solid rgba(219,242,252,.28);border-radius:8px;padding:22px 22px 24px}
.song q{display:block;font:italic 400 1.5rem/1.25 var(--serif);quotes:"«" "»";margin:0 0 10px}
.song small{display:block;opacity:.7;margin:0 0 18px;font-size:.9rem}

/* ============ DIREZIONE A - Notte editoriale ============ */
.A .sky{position:sticky;top:0;height:100cqh;margin-bottom:-100cqh;background:var(--deep) url("img/luna-mobile.webp") 50% 12%/cover no-repeat;will-change:transform}
.A .hero{position:relative;height:100cqh;padding:26px 24px;display:flex;flex-direction:column;justify-content:space-between}
.A .bar{display:flex;justify-content:space-between;align-items:center}
.A .bar .logo{font-size:1.5rem}
.A .bar nav{display:none;gap:30px;font:500 .74rem var(--serif);letter-spacing:.2em;text-transform:uppercase}
.A .bar nav a:hover{color:var(--pink)}
.A .bar .menu{font:500 .74rem var(--serif);letter-spacing:.2em;text-transform:uppercase;min-height:44px;display:flex;align-items:center}
.A .heroTxt{margin-bottom:6vh}
.A .heroTxt .logo{font-size:3.7rem}
.A .panel{position:relative;padding:130px 24px 40px;background:linear-gradient(to bottom,rgba(4,27,56,0),rgba(4,27,56,.93) 120px)}
.A .panel+.panel{padding-top:44px;background:rgba(4,27,56,.93)}
.A .rooms{list-style:none;margin:0 0 46px;padding:0}
.A .rooms li{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(219,242,252,.2);padding:16px 0;min-height:56px;transition:padding .25s}
.A .rooms li:last-child{border-bottom:1px solid rgba(219,242,252,.2)}
.A .rooms li:hover{padding-left:12px;color:var(--pink)}
.A .rooms .vet{font-size:1.5rem}
.A .rooms .num{opacity:.6;font-size:1rem}
.A .entry{display:block;padding:18px 0;border-top:1px solid rgba(219,242,252,.14)}
.A .entry small{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-bottom:6px}
.A .entry h3{font:italic 400 1.55rem/1.15 var(--serif);margin:0;transition:color .2s}
.A .entry:hover h3{color:var(--pink)}
.A .foot{padding:36px 24px 44px;background:rgba(4,27,56,.93);font-size:.8rem;opacity:.9;display:flex;justify-content:space-between;align-items:center;gap:14px}
.A .foot .logo{font-size:1.4rem}
@container (min-width:820px){
  .A .hero{padding:34px 64px}
  .A .bar .logo{font-size:1.8rem}
  .A .bar nav{display:flex}.A .bar .menu{display:none}
  .A .heroTxt .logo{font-size:7.2rem}
  .A .heroTxt{margin-bottom:9vh}
  .A .sky{background-image:url("img/luna-desktop.webp");background-position:50% 30%}
  .A .panel{padding:140px 64px 56px}
  .A .panel+.panel{padding-top:56px}
  .A .cols{display:grid;grid-template-columns:5fr 7fr;gap:72px;align-items:start}
  .A .rooms{margin:0}
  .A .rooms .vet{font-size:1.9rem}
  .A .two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
  .A .foot{padding:36px 64px 44px}
}

/* ============ DIREZIONE B - Carta di luna ============ */
.B .band{position:relative;height:88cqh;background:var(--deep) url("img/luna-mobile.webp") 50% 10%/cover no-repeat;padding:26px 24px;display:flex;flex-direction:column;justify-content:space-between}
.B .band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(transparent,var(--seal));pointer-events:none}
.B .band>*{position:relative;z-index:2}
.B .bar{display:flex;justify-content:space-between;align-items:center}
.B .bar .logo{font-size:1.5rem}
.B .bar nav{display:none;gap:30px;font:500 .74rem var(--serif);letter-spacing:.2em;text-transform:uppercase}
.B .bar .menu{font:500 .74rem var(--serif);letter-spacing:.2em;text-transform:uppercase;min-height:44px;display:flex;align-items:center}
.B .heroTxt .logo{font-size:3.7rem}
.B .heroTxt{margin-bottom:27cqh}
.B .paper{background:var(--seal);color:var(--navy);padding:6px 24px 48px;position:relative;z-index:3}
.B .paper .lab{color:#d4405e}
.B .tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(7,45,89,.25);margin-bottom:6px}
.B .tabs a{font:500 .78rem var(--serif);letter-spacing:.16em;text-transform:uppercase;padding:14px 0;white-space:nowrap;min-height:44px;border-bottom:2px solid transparent;margin-bottom:-1px;opacity:.65}
.B .tabs a.on,.B .tabs a:hover{opacity:1;border-bottom-color:var(--pink)}
.B .row{display:grid;grid-template-columns:54px 1fr;gap:4px 14px;padding:20px 0;border-bottom:1px solid rgba(7,45,89,.2);position:relative}
.B .row .num{grid-row:1/3;font-size:2.4rem;line-height:1;color:var(--navy);opacity:.35;transition:opacity .2s,color .2s}
.B .row h3{font:italic 500 1.5rem/1.15 var(--serif);margin:0}
.B .row small{line-height:1.5;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.65}
.B .row::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--pink);transition:width .35s}
.B .row:hover::after{width:100%}.B .row:hover .num{opacity:1;color:#d4405e}
.B .song{border-color:rgba(7,45,89,.35);margin-top:40px}
.B .btn{color:#c22f4d;border-color:#c22f4d}.B .btn:hover{background:#c22f4d;color:#fff}
.B .tt{margin-top:8px}
.B .foot{background:var(--navy);color:var(--seal);padding:34px 24px 40px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:.8rem}
.B .foot .logo{font-size:1.4rem}
@container (min-width:820px){
  .B .band{padding:34px 64px;height:92cqh;background-image:url("img/luna-desktop.webp");background-position:50% 28%}
  .B .bar .logo{font-size:1.8rem}.B .bar nav{display:flex}.B .bar .menu{display:none}
  .B .heroTxt .logo{font-size:7.2rem}
  .B .paper{padding:6px 64px 64px}
  .B .idx{display:grid;grid-template-columns:7fr 5fr;gap:80px;align-items:start}
  .B .row{grid-template-columns:90px 1fr}.B .row .num{font-size:3.6rem}.B .row h3{font-size:1.9rem}
  .B .song{margin-top:0}
  .B .foot{padding:34px 64px 40px}
}

/* ============ DIREZIONE C - Discesa ============ */
.C .sky{position:sticky;top:0;height:100cqh;margin-bottom:-100cqh;background:var(--deep) url("img/luna-mobile.webp") 72% 22%/cover no-repeat;transform-origin:78% 24%;will-change:transform}
.C .chap{position:relative;min-height:100cqh;display:flex;flex-direction:column;justify-content:center;padding:70px 26px}
.C .chap .lab{margin-bottom:14px}
.C .chap h2.vet{font-size:2.9rem;margin:0 0 16px}
.C .chap p:not(.tag){font:italic 400 1.2rem/1.35 var(--serif);margin:0 0 22px;max-width:30ch;opacity:.92}
.C .chap .more{font:500 .76rem var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--pink);display:inline-flex;align-items:center;min-height:44px}
.C .chap.first{justify-content:space-between;padding:26px}
.C .chap.first .logo{font-size:3.7rem}
.C .dock{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px 26px;margin-bottom:-60px;background:linear-gradient(rgba(4,27,56,.7),transparent)}
.C .dock .logo{font-size:1.3rem}
.C .dock .menu{font:500 .74rem var(--serif);letter-spacing:.2em;text-transform:uppercase;min-height:44px;display:flex;align-items:center}
.C .chap .tt,.C .chap .song{max-width:420px}
.C .chap .song{background:rgba(4,27,56,.55)}
@container (min-width:820px){
  .C .dock{padding:22px 64px}.C .dock .logo{font-size:1.6rem}
  .C .chap{padding:80px 64px;align-items:flex-start}
  .C .chap.first{padding:34px 64px}.C .chap.first .logo{font-size:7.2rem}
  .C .chap h2.vet{font-size:6rem}
  .C .chap p:not(.tag){font-size:1.5rem;max-width:34ch}
  .C .sky{background-image:url("img/luna-desktop.webp");background-position:50% 30%;transform-origin:76% 30%}
}

/* ============ LETTURA (comune) ============ */
.read .wrap{position:relative;padding:20px 26px 90px;max-width:760px;margin:0 auto}
.read .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}
.read .head a{font:500 .74rem var(--serif);letter-spacing:.2em;text-transform:uppercase;min-height:44px;display:flex;align-items:center}
.read .head a:hover{color:var(--pink)}
.read .head .logo{font-size:1.3rem}
.read .cat{font:500 .74rem var(--serif);letter-spacing:.22em;text-transform:uppercase;color:var(--pink);margin-bottom:16px}
.read h1{font-size:2.5rem;margin:0 0 14px}
.read .meta{font-size:.9rem;opacity:.7;margin:0 0 54px}
.read .v{font:400 1.45rem/1.5 var(--serif);margin:0;transition:none;text-wrap:balance}
.read .st{margin:0 0 44px}
.read .next{border-top:1px solid currentColor;border-color:rgba(127,160,190,.35);padding-top:22px;margin-top:70px;display:block}
.read .next small{display:block;font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;opacity:.65;margin-bottom:6px}
.read .next b{font:italic 500 1.5rem var(--serif)}
@container (min-width:820px){
  .read .wrap{padding:26px 64px 120px}
  .read h1{font-size:4.6rem}
  .read .v{font-size:1.85rem;line-height:1.55}
  .read .head{margin-bottom:90px}
}
/* lettura A (scura sul cielo) */
.A.read .sky{background-position:50% 8%}
.A.read .veil{position:sticky;top:0;height:100cqh;margin-bottom:-100cqh;background:rgba(4,27,56,.8);pointer-events:none}
.A.read .wrap{color:#fff}
/* lettura B (carta chiara) */
.B.read .scroller{background:var(--seal)}
.B.read .wrap{color:var(--navy)}
.B.read .cat{color:#c22f4d}
.B.read .head .logo{color:var(--navy)}
.B.read .head a:hover{color:#c22f4d}
.B.read .sig{color:#c22f4d}
.B.read .prog{background:rgba(7,45,89,.12)}
/* lettura C (una strofa per schermata) */
.C.read .snap{scroll-snap-type:y mandatory}
.C.read .stz{min-height:100cqh;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:flex-end;padding:70px 28px 22cqh;max-width:820px;margin:0 auto}
.C.read .stz.t{justify-content:flex-start;padding-bottom:70px}
.C.read .veil{position:sticky;top:0;height:100cqh;margin-bottom:-100cqh;background:linear-gradient(rgba(4,27,56,0),rgba(4,27,56,.55) 55%);pointer-events:none}
.C.read .stz .v{font-size:1.9rem;line-height:1.35}
.C.read .stz.t h1{font-size:3rem}
.C.read .dot{position:fixed}
@container (min-width:820px){.C.read .stz{padding:70px 64px;justify-content:center;max-width:720px;margin:0 auto 0 0}.C.read .stz.t{justify-content:center}.C.read .stz .v{font-size:2.8rem}.C.read .stz.t h1{font-size:6rem}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.sky{transform:none!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <h1>teloscrivo<i></i></h1>
    <div class="grp" id="gDir" aria-label="Architettura">
      <button data-v="A" aria-pressed="true">A · Notte editoriale</button>
      <button data-v="B" aria-pressed="false">B · Carta di luna</button>
      <button data-v="C" aria-pressed="false">C · Discesa</button>
    </div>
    <div class="grp" id="gDev" aria-label="Dispositivo">
      <button data-v="m" aria-pressed="true">Mobile</button>
      <button data-v="d" aria-pressed="false">Desktop</button>
    </div>
    <div class="grp" id="gView" aria-label="Pagina">
      <button data-v="home" aria-pressed="true">Home</button>
      <button data-v="read" aria-pressed="false">Lettura</button>
    </div>
  </div>
  <p class="why" id="why"></p>
  <div class="stagebox"><div class="device" id="dev"></div></div>
  <p class="why" style="margin-top:14px"><b>Nota:</b> testi, titoli, date, link Spotify e TikTok sono di ESEMPIO scritti da Claude. Lo sfondo luna è generato con Ideogram (versione desktop a bassa risoluzione, da rifare in alta per il sito vero). L'intro con lo zoom sulla luna non è in questo mockup: si definisce dopo.</p>
</div>

<script>
/* ===== DATI DI ESEMPIO ===== */
const ROOMS=[["Testi",12],["Poesie",9],["Racconti brevi",4],["Dalle canzoni",7],["TikTok",6]];
const E=[
 {n:"01",t:"Nove di sera",c:"Poesie",d:"3 nov 2026",m:"1 min"},
 {n:"02",t:"Le cose che non ti ho detto",c:"Testi",d:"28 ott 2026",m:"4 min"},
 {n:"03",t:"La finestra di fronte",c:"Racconti brevi",d:"21 ott 2026",m:"7 min"},
 {n:"04",t:"Resta anche se non parli",c:"Dalle canzoni",d:"14 ott 2026",m:"2 min"},
 {n:"05",t:"Cadere piano",c:"Poesie",d:"6 ott 2026",m:"1 min"}
];
const TT=["Quello che non dico","Nove di sera","Scrivere di notte"];
const STANZE=[
 ["Non ho mai saputo dirtelo","a voce, con la faccia ferma","e le mani che non sanno dove stare."],
 ["Così te lo scrivo.","Una riga alla volta,","come si accendono le luci di una casa","quando qualcuno finalmente torna."],
 ["Se leggi fino a qui","vuol dire che il buio","non ha vinto.","Ha solo aspettato","che trovassi le parole."]
];
const WHY={
 A:"<b>A · Notte editoriale.</b> Il cielo resta fermo dietro e il testo ci scorre sopra: sei sempre «sotto la luna». Home = elenco semplice (stanze + ultimi testi). Lettura SCURA, riga per riga che si accende e si spegne con lo scroll (in entrambe le direzioni). Più vicina al tuo concept.",
 B:"<b>B · Carta di luna.</b> Il cielo è solo l'apertura: scorrendo le nuvole diventano carta chiara (#DBF2FC) e il blog si legge come una rivista, con indice numerato in Fibonacci. Lettura CHIARA, inchiostro blu. Più leggibile per testi lunghi, meno «notte».",
 C:"<b>C · Discesa.</b> La home è un unico scroll: la luna si avvicina (zoom) mentre passi da una stanza all'altra, una per schermata. Lettura SCURA, UNA STROFA PER SCHERMATA con scatto. È l'idea dell'intro portata dentro tutto il sito; la più emozionale, la meno «veloce da consultare»."
};

/* ===== COSTRUZIONE HTML ===== */
const logo=(c='')=>`<span class="logo ${c}">teloscrivo<i></i></span>`;
const tagl=`<p class="tag">quello che a voce non so dire</p>`;
const roomsLi=ROOMS.map(r=>`<li class="go" data-go><span class="vet">${r[0]}</span><span class="num">${String(r[1]).padStart(2,"0")}</span></li>`).join("");
const entryA=e=>`<a class="entry go" data-go><small>${e.c} &nbsp;·&nbsp; ${e.d}</small><h3>${e.t}</h3></a>`;
const songBlock=`<div class="song"><q>Resta anche se non parli</q><small>da «Titolo di esempio» · Artista di esempio</small><a class="btn" href="#" onclick="return false">Ascolta su Spotify</a></div>`;
const ttBlock=`<div class="tt">${TT.map(t=>`<a href="#" onclick="return false"><span>${t}</span></a>`).join("")}</div>`;
const navLinks=["Testi","Poesie","Racconti","Canzoni","TikTok"].map(x=>`<a href="#" onclick="return false">${x}</a>`).join("");

const T={
A:{
 home:()=>`<div class="A"><div class="scroller"><div class="sky"></div>
  <section class="hero"><div class="bar">${logo()}<nav>${navLinks}</nav><a class="menu go">Menu</a></div>
   <div class="heroTxt">${logo()}${tagl}</div><div class="cue">scorri</div></section>
  <section class="panel"><div class="cols">
   <div><h2 class="lab">Le stanze</h2><ul class="rooms">${roomsLi}</ul></div>
   <div><h2 class="lab">Ultimi testi</h2>${E.map(entryA).join("")}</div></div></section>
  <section class="panel"><div class="two"><div><h2 class="lab">Dalle canzoni</h2>${songBlock}</div><div><h2 class="lab">TikTok</h2>${ttBlock}</div></div></section>
  <div class="foot">${logo()}<span class="ex">blog personale di Tomas</span></div></div></div>`,

/* ===== STATO E RENDER ===== */
const st={dir:"A",dev:"m",view:"home"};
const dev=document.getElementById("dev");
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function render(){
  dev.className="device"+(st.dev==="d"?" d":"");
  dev.innerHTML=T[st.dir][st.view]();
  document.getElementById("why").innerHTML=WHY[st.dir];
  for(const [id,key] of [["gDir","dir"],["gDev","dev"],["gView","view"]])
    document.querySelectorAll("#"+id+" button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st[key]));
  const sc=dev.querySelector(".scroller"); bind(sc);
}
function bind(sc){
  const sky=sc.querySelector(".sky"), bar=sc.querySelector(".prog b"), rv=[...sc.querySelectorAll(".rv")];
  const tick=()=>{
    const H=sc.clientHeight, max=Math.max(1,sc.scrollHeight-H), y=sc.scrollTop, p=y/max;
    if(bar) bar.style.width=(p*100)+"%";
    if(!reduce){
      if(sky){
        if(sc.dataset.par==="C") sky.style.transform=`scale(${1+p*0.9})`;
        else if(sc.dataset.par==="Cr") sky.style.transform=`scale(${1+p*0.35})`;
        else sky.style.transform=`translateY(${-y*0.12}px)`;
      }
      const par=sc.dataset.par;
      if(par==="B"){const b=sc.querySelector(".band"); if(b) b.style.backgroundPositionY=`calc(10% + ${y*0.06}px)`;}
    }
    if(rv.length){
      const mid=sc.getBoundingClientRect().top+H*0.5;
      rv.forEach(el=>{
        if(reduce){el.style.opacity=1;return}
        const r=el.getBoundingClientRect(), c=r.top+r.height/2, dist=Math.abs(c-mid)/(H*0.5);
        const o=clamp(1.25-dist*1.15,0.12,1);
        el.style.opacity=o.toFixed(3);
        el.style.transform=`translateY(${((c-mid)/H*14).toFixed(1)}px)`;
      });
    }
  };
  sc.addEventListener("scroll",tick,{passive:true}); tick();
}
dev.addEventListener("click",e=>{
  if(e.target.closest("[data-go]")){st.view="read";document.querySelectorAll("#gView button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v==="read"));render();}
  else if(e.target.closest("[data-home]")){st.view="home";render();}
});
for(const [id,key] of [["gDir","dir"],["gDev","dev"],["gView","view"]])
  document.getElementById(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st[key]=b.dataset.v;render();});

/* stato iniziale da hash: #A-m-home  (utile per gli screenshot) */
const h=location.hash.replace("#","").split("-");
if(h.length>=3){st.dir=h[0];st.dev=h[1];st.view=h[2]}
render();
/* scroll iniziale da hash: #A-m-home-600 */
const sy=parseInt(h[3]||"0",10); if(sy){dev.querySelector(".scroller").scrollTop=sy}
</script>
